<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NIIO — Official Website</title>
  <meta name="description" content="NIIO — Italian DJ & music producer based in Milan. Official website, tour dates, gigs, music, and booking contacts.">
  <meta property="og:title" content="NIIO — Official Website">
  <meta property="og:description" content="NIIO — Italian DJ & music producer based in Milan. Official tour dates, gigs, releases, and bookings.">
  <meta property="og:image" content="./assets/press-center.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">

  <style>
    @font-face {
      font-family: 'Helvetica Neue Custom';
      src: url('./Helvetica-Neue-65-Medium.ttf') format('truetype');
      font-weight: 500 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --text: #f8f8f8;
      --muted: rgba(248, 248, 248, 0.6);
      --pill-bg: rgba(68, 68, 68, 0.5);
      --pill-hover: rgba(255, 255, 255, 0.22);
      --border: rgba(255, 255, 255, 0.15);
      --pad: clamp(16px, 4vw, 48px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue Custom', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      height: 100svh;
      width: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Main Fullscreen Landing Viewport */
    .landing {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(clamp(20px, 4vh, 48px) + env(safe-area-inset-top)) var(--pad) calc(clamp(16px, 2.5vh, 28px) + env(safe-area-inset-bottom));
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Cinematic background photo with dark vignette */
    .landing-bg {
      position: absolute;
      inset: 0;
      background-color: #000000;
      background-image: url('./assets/hero-bg.webp');
      background-position: center 28%;
      background-repeat: no-repeat;
      background-size: cover;
      z-index: 1;
    }

    .landing-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at center 35%, rgba(0, 0, 0, 0.05) 15%, rgba(0, 0, 0, 0.5) 60%, #000000 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.05) 20%, rgba(0, 0, 0, 0.15) 65%, rgba(0, 0, 0, 0.85) 90%, #000000 100%);
      pointer-events: none;
    }

    /* Foreground content layers above background */
    .landing-header,
    .landing-bottom {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Logo (incastrato più piccolo ed elegante) */
    .landing-header {
      padding-top: clamp(10px, 2.2vh, 24px);
    }

    .logo-h {
      width: clamp(140px, 15vw, 210px);
      height: auto;
      max-height: clamp(40px, 6vh, 68px);
      fill: var(--text);
      display: block;
      filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.9));
    }

    /* Bottom Interactive Area */
    .landing-bottom {
      gap: clamp(14px, 2.2vh, 22px);
    }

    /* Social Links Grid */
    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2.5vw, 26px);
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      opacity: 0.85;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      padding: 6px;
    }

    .social-link:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    .social-link svg {
      width: clamp(19px, 1.8vw, 24px);
      height: clamp(19px, 1.8vw, 24px);
      display: block;
      fill: currentColor;
    }

    /* Main Action Buttons (Gigs / Contacts) */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.6vw, 18px);
      width: 100%;
      max-width: 440px;
    }

    .btn-action {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: clamp(9px, 1.4vh, 13px) clamp(18px, 2.4vw, 32px);
      background: var(--pill-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--text);
      font-family: inherit;
      font-size: clamp(12.5px, 1.1vw, 15px);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn-action svg {
      width: 12px;
      height: 12px;
      display: block;
      stroke: currentColor;
      transition: transform 0.2s ease;
    }

    .btn-action:hover {
      background: var(--pill-hover);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-action:hover svg {
      transform: translate(2px, -2px);
    }

    /* Footer Row */
    .landing-footer {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(10px, 0.85vw, 12px);
      color: var(--muted);
      letter-spacing: 0.02em;
      padding-top: 4px;
    }

    .landing-footer .copy {
      opacity: 0.75;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.05em;
    }

    .landing-footer .presskit-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .landing-footer .presskit-link:hover {
      color: var(--text);
    }

    /* Contacts Drawer Modal (Pawsa bookings drawer style) */
    .contacts-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--pad);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .contacts-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .contacts-card {
      position: relative;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      padding: clamp(28px, 5vh, 44px) clamp(24px, 4vw, 40px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      transform: translateY(12px) scale(0.98);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .contacts-overlay.active .contacts-card {
      transform: translateY(0) scale(1);
    }

    .contacts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }

    .contacts-title {
      font-size: clamp(20px, 2.5vw, 28px);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .contacts-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .contact-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .contact-tag {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 500;
    }

    .contact-email {
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.15s ease;
      word-break: break-all;
    }

    .contact-email:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Mobile specific tweaks */
    @media (max-width: 600px) {
      .landing-bg {
        background-image: url('./assets/hero-bg-mobile.webp');
        background-size: cover;
        background-position: center 22%;
      }

      .logo-h {
        width: clamp(125px, 32vw, 155px);
      }

      .actions {
        flex-direction: column;
        width: 100%;
        max-width: 320px;
        gap: 10px;
      }

      .btn-action {
        width: 100%;
        padding: 12px 20px;
      }

      .landing-footer {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
    }
  </style>
</head>

  <!-- Contacts Modal / Overlay (Pawsa Bookings Drawer Style) -->

  <script>
    (function() {
      // Dynamic year
      document.getElementById('year').textContent = new Date().getFullYear();

      // Modal handling
      var openBtn = document.getElementById('open-contacts-btn');
      var closeBtn = document.getElementById('close-contacts-btn');
      var modal = document.getElementById('contacts-modal');

      function openModal() {
        modal.classList.add('active');
        modal.setAttribute('aria-hidden', 'false');
        openBtn.setAttribute('aria-expanded', 'true');
        closeBtn.focus();
      }

      function closeModal() {
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
        openBtn.setAttribute('aria-expanded', 'false');
        openBtn.focus();
      }

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);

      // Close on backdrop click
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          closeModal();
        }
      });

      // Close on Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeModal();
        }
      });
    })();
  </script>
